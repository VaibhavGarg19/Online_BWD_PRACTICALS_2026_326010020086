<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Registration</title>
</head>
<body>
    <h1>Student Registration Form</h1>

    <form action="#" method="post">
        <fieldset>
            <legend>Personal Information</legend>

            <p>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" autocomplete="name" required>
            </p>

            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </p>

            <p>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" minlength="8"
                       autocomplete="new-password" required>
            </p>

            <fieldset>
                <legend>Gender:</legend>
                <input type="radio" id="gender-female" name="gender" value="female" required>
                <label for="gender-female">Female</label>
                <input type="radio" id="gender-male" name="gender" value="male">
                <label for="gender-male">Male</label>
                <input type="radio" id="gender-other" name="gender" value="other">
                <label for="gender-other">Other</label>
            </fieldset>

            <p>
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="date_of_birth" autocomplete="bday" required>
            </p>

            <p>
                <label for="city">City:</label>
                <select id="city" name="city" required>
                    <option value="">Select a city</option>
                    <option value="ahmedabad">Ahmedabad</option>
                    <option value="delhi">Delhi</option>
                    <option value="jaipur">Jaipur</option>
                    <option value="mumbai">Mumbai</option>
                    <option value="other">Other</option>
                </select>
            </p>
        </fieldset>

        <fieldset>
            <legend>Course and Interests</legend>

            <p>
                <label for="course">Course:</label>
                <select id="course" name="course" required>
                    <option value="">Select a course</option>
                    <option value="bca">Bachelor of Computer Applications (BCA)</option>
                    <option value="btech">Bachelor of Technology (B.Tech)</option>
                    <option value="bba">Bachelor of Business Administration (BBA)</option>
                    <option value="bcom">Bachelor of Commerce (B.Com)</option>
                </select>
            </p>

            <fieldset>
                <legend>Hobbies (select all that apply):</legend>
                <input type="checkbox" id="hobby-reading" name="hobbies" value="reading">
                <label for="hobby-reading">Reading</label>
                <input type="checkbox" id="hobby-sports" name="hobbies" value="sports">
                <label for="hobby-sports">Sports</label>
                <input type="checkbox" id="hobby-music" name="hobbies" value="music">
                <label for="hobby-music">Music</label>
                <input type="checkbox" id="hobby-travel" name="hobbies" value="travel">
                <label for="hobby-travel">Travel</label>
            </fieldset>
        </fieldset>

        <p>
            <label for="address">Address:</label><br>
            <textarea id="address" name="address" rows="4" cols="40"
                      autocomplete="street-address" required></textarea>
        </p>

        <button type="submit">Register</button>
        <button type="reset">Clear Form</button>
    </form>
</body>
</html>
