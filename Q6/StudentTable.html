<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Table</title>
</head>
<body>
    <h1 align="center">Student Marks</h1>

    <table border="1" cellpadding="8" cellspacing="0" align="center">
        <caption align="center">Student marks, totals, percentages, and grades</caption>
        <thead>
            <tr>
                <th scope="col" align="center">Student Name</th>
                <th scope="col" align="center">Entrepreneurship</th>
                <th scope="col" align="center">Mathematics</th>
                <th scope="col" align="center">Basics of web development</th>
                <th scope="col" align="center">Total (out of 300)</th>
                <th scope="col" align="center">Percentage</th>
                <th scope="col" align="center">Grade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row" align="center">Vaibhav Garg</th>
                <td align="center">85</td>
                <td align="center">92</td>
                <td align="center">88</td>
                <td align="center">265</td>
                <td align="center">88.33%</td>
                <td align="center">A</td>
            </tr>
            <tr>
                <th scope="row" align="center">Diya Sharma</th>
                <td align="center">78</td>
                <td align="center">84</td>
                <td align="center">81</td>
                <td align="center">243</td>
                <td align="center">81%</td>
                <td align="center">B</td>
            </tr>
            <tr>
                <th scope="row" align="center">Kabir Singh</th>
                <td align="center">95</td>
                <td align="center">89</td>
                <td align="center">94</td>
                <td align="center">278</td>
                <td align="center">92.67%</td>
                <td align="center">A+</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
